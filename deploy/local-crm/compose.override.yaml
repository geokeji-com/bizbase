# 与项目根目录 pwd.yml 一起使用，复用 bizbase 现有数据库和站点卷。
x-crm-image: &crm-image
  image: bizbase/local:0.0.1
  pull_policy: never
  volumes:
    - type: bind
      source: ./apps/bizbase
      target: /home/frappe/frappe-bench/apps/bizbase
      bind:
        create_host_path: false

services:
  backend:
    <<: *crm-image
  frontend:
    <<: *crm-image
    volumes:
      - ./deploy/local-crm/nginx.conf.template:/templates/nginx/frappe.conf.template:ro
      - ./apps/bizbase:/home/frappe/frappe-bench/apps/bizbase:ro
  configurator:
    <<: *crm-image
  create-site:
    <<: *crm-image
  queue-long:
    <<: *crm-image
  queue-short:
    <<: *crm-image
  scheduler:
    <<: *crm-image
  websocket:
    <<: *crm-image
