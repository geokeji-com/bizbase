# 旧 MariaDB 预览。移山 ID 与 Nginx 使用此镜像的匹配版本，便于恢复旧站。
x-crm-image: &crm-image
  image: bizbase/local:static-share-0.1.0
  pull_policy: never
  volumes:
    - type: bind
      source: ./apps/static_share
      target: /home/frappe/frappe-bench/apps/static_share
      bind:
        create_host_path: false
    - type: bind
      source: ./apps/geo_operations
      target: /home/frappe/frappe-bench/apps/geo_operations
      bind:
        create_host_path: false

services:
  backend:
    <<: *crm-image
  frontend:
    <<: *crm-image
    volumes:
      - ./apps/static_share:/home/frappe/frappe-bench/apps/static_share:ro
      - ./apps/geo_operations:/home/frappe/frappe-bench/apps/geo_operations:ro
  configurator:
    <<: *crm-image
  create-site:
    <<: *crm-image
  queue-long:
    <<: *crm-image
  queue-short:
    <<: *crm-image
  scheduler:
    <<: *crm-image
  websocket:
    <<: *crm-image
