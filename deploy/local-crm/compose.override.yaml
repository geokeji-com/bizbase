# 与项目根目录 pwd.yml 一起使用，复用 bizbase 现有数据库和站点卷。
x-crm-image: &crm-image
  image: bizbase/local:static-share-0.1.0
  pull_policy: never
  volumes:
    - type: bind
      source: ./apps/static_share
      target: /home/frappe/frappe-bench/apps/static_share
      bind:
        create_host_path: false
    - type: bind
      source: ./apps/geo_operations
      target: /home/frappe/frappe-bench/apps/geo_operations
      bind:
        create_host_path: false
    - type: bind
      source: ./apps/yishan_id_login
      target: /home/frappe/frappe-bench/apps/yishan_id_login
      bind:
        create_host_path: false

services:
  backend:
    <<: *crm-image
  frontend:
    <<: *crm-image
    volumes:
      - ./deploy/local-crm/nginx.conf.template:/templates/nginx/frappe.conf.template:ro
      - ./apps/static_share:/home/frappe/frappe-bench/apps/static_share:ro
      - ./apps/geo_operations:/home/frappe/frappe-bench/apps/geo_operations:ro
      - ./apps/yishan_id_login:/home/frappe/frappe-bench/apps/yishan_id_login:ro
  configurator:
    <<: *crm-image
  create-site:
    <<: *crm-image
  queue-long:
    <<: *crm-image
  queue-short:
    <<: *crm-image
  scheduler:
    <<: *crm-image
  websocket:
    <<: *crm-image
