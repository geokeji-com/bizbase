name: bizbase-prod

x-runtime: &runtime
  image: ${BIZBASE_IMAGE:?Set the verified amd64 image tag before deploying}
  platform: linux/amd64
  pull_policy: never
  restart: unless-stopped
  # prepare_host.py creates the assets link once for all processes.
  entrypoint: []
  environment:
    BIZBASE_YISHAN_ID_CONFIG: /run/bizbase-id/settings.json
  volumes:
    - /var/lib/bizbase-prod/sites:/home/frappe/frappe-bench/sites
    - /var/lib/bizbase-prod/logs:/home/frappe/frappe-bench/logs
    - /etc/bizbase/yishan-runtime:/run/bizbase-id:ro
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

# Blue-green slots run this file under separate project names and ports; see deploy.sh.
x-health: &health
  interval: 5s
  timeout: 3s
  retries: 3
  start_period: 120s
  start_interval: 2s

services:
  backend:
    <<: *runtime
    command: [start.sh]
    # Any HTTP answer means gunicorn has preloaded the app and bound the port.
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'curl -so /dev/null http://127.0.0.1:8000/api/method/ping']
    stop_grace_period: 30s
  websocket:
    <<: *runtime
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
  scheduler:
    <<: *runtime
    command: [bench, schedule]
  worker:
    <<: *runtime
    command: [bench, worker, --queue, 'short,default,long']
    # SIGTERM lets RQ finish the running job before the slot hands over.
    stop_grace_period: 120s
  frontend:
    <<: *runtime
    command: [nginx-entrypoint.sh]
    depends_on: [backend, websocket]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${BIZBASE_SITE:-bizbase.geokeji.com}
      UPSTREAM_REAL_IP_ADDRESS: ${BIZBASE_PROXY_IP:-127.0.0.1}
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'curl -fso /dev/null http://127.0.0.1:8080/api/method/ping']
    ports:
      - '127.0.0.1:${BIZBASE_PORT:-3180}:8080'
