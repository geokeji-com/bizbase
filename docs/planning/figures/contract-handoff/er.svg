<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="608" viewBox="0 0 1040 608" role="img" aria-labelledby="title desc">
<title id="title">签约方、付款方、被服务组织与标的如何关联</title><desc id="desc">箭头标签说明业务关系；“1 对多条关联”表示每条关联各引用一份合同和一项服务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="606" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">实体关系图（ER）</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">签约方、付款方、被服务组织与标的如何关联</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">箭头标签说明业务关系；“1 对多条关联”表示每条关联各引用一份合同和一项服务。</text>
<rect x="30" y="146" width="235" height="80" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="44" y="174" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">客户 / 组织</text><text x="44" y="200" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">Customer · 共享主档</text><rect x="390" y="146" width="249" height="80" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="404" y="174" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">合同</text><text x="404" y="200" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">Contract · 期间与依据</text><rect x="390" y="288" width="249" height="85" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="404" y="316" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">服务与合同的关联</text><text x="404" y="342" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">记录双方标识和适用期间</text><rect x="390" y="444" width="249" height="84" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="404" y="472" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">GEO 服务</text><text x="404" y="498" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">对一个被服务组织履约</text><rect x="33" y="444" width="230" height="84" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="47" y="472" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">优化标的</text><text x="47" y="498" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">公司、品牌或产品</text><rect x="759" y="444" width="250" height="84" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="773" y="472" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">成员与有效范围</text><text x="773" y="498" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">员工、角色、起止时间</text><rect x="759" y="146" width="250" height="80" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="773" y="174" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">合同包含的被服务组织</text><text x="773" y="200" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">同一合同可覆盖多个组织</text><polyline points="265,185 390,185" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="327" y="171" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">签约方 / 付款方</text><polyline points="638,185 759,185" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="698" y="171" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">一份对多项</text><polyline points="515,226 515,288" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="589" y="264" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">1 对多条关联</text><polyline points="515,443 515,373" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="570" y="391" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">1 对多条关联</text><polyline points="390,488 263,488" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="326" y="475" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">1 至多个</text><polyline points="639,488 759,488" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="699" y="475" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">1 至多名</text><polyline points="878,227 878,317 705,317 705,403 624,403 624,442" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="867" y="344" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">服务组织须在合同范围内</text><text x="32" y="575" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">首版走查取一份合同、一个服务、一个标的。跨期关联允许回查服务当时所依据的合同。</text>
</g></svg>
