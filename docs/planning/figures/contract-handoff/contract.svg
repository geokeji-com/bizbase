<rect x="32" y="154" width="239" height="83" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="46" y="182" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">既有已签合同</text><text x="46" y="208" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">C1 按实际签署件建档</text><rect x="32" y="310" width="239" height="83" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="46" y="338" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">新签 · 选核准模板</text><text x="46" y="364" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">录入主体、期间和交易条件</text><rect x="335" y="310" width="272" height="83" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="349" y="338" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">生成待签 PDF</text><text x="349" y="364" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">保存模板版本与实际出件</text><rect x="676" y="310" width="330" height="83" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="690" y="338" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">回传签署件并核验</text><text x="690" y="364" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">登记签署信息和对应出件版本</text><rect x="676" y="154" width="330" height="83" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="690" y="182" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">按同一合同编号发起交接</text><text x="690" y="208" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">运营核对获准的签署版本与范围</text><polyline points="272,195 675,195" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="272,351 333,351" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="606,351 675,351" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="841,309 841,238" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="474,394 474,446 151,446 151,395" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="323" y="436" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">条件变更后重新出件</text><text x="30" y="501" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">待确认的新签路径用一份公司核准模板验字段、中文 PDF 和回签版本；C1 的交接沿上排进行。</text>
