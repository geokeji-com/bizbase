<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
<title id="title">同一项服务，多个入口怎样读到同一份事实</title><desc id="desc">从入口向下看，合同主档、共享资料授权和 GEO 服务范围各有归属。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="588" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">产品架构图</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">同一项服务，多个入口怎样读到同一份事实</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">从入口向下看，合同主档、共享资料授权和 GEO 服务范围各有归属。</text>
<rect x="35" y="150" width="340" height="84" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="49" y="178" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">员工入口</text><text x="49" y="204" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">Desk  ·  CLI  ·  员工 Agent</text><rect x="675" y="150" width="330" height="84" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="689" y="178" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">程序入口（后续）</text><text x="689" y="204" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">采集应用与报告应用各用受限凭证</text><polyline points="205,235 205,266 493,266 493,290" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="840,235 840,266 550,266 550,290" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="230" y="292" width="580" height="85" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="244" y="320" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">业务操作 / API</text><text x="244" y="346" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">核对调用身份、允许动作、业务范围和有效期</text><polyline points="520,378 520,408" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="520,396 187,396 187,409" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="520,396 854,396 854,409" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="30" y="410" width="314" height="110" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="44" y="438" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">ERPNext · 共享主档</text><text x="44" y="464" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">Customer、Contract</text><text x="44" y="487" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">提供一致的客户与签约依据</text><rect x="362" y="410" width="316" height="110" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="376" y="438" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">BizBase · 跨应用资料授权</text><text x="376" y="464" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">约束联系人、地址与私有附件</text><text x="376" y="487" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">使共享资料可按业务范围读取</text><rect x="697" y="410" width="314" height="110" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="711" y="438" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">GEO 运营 · 服务与履约</text><text x="711" y="464" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">服务、成员、标的、有效期间</text><text x="711" y="487" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">后续承接监测、分析和交付</text><text x="33" y="560" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">Frappe 承载用户与角色。三块业务职责可以位于同一站点；图中连线表达依赖关系。</text>
</g></svg>
