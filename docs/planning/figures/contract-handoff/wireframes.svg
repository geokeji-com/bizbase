<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="595" viewBox="0 0 1040 595" role="img" aria-labelledby="title desc">
<title id="title">两个岗位从相反方向核对同一笔交接</title><desc id="desc">服务 FW-01 和合同 HT-01 仅用于走查。评审时请两人各自写下合同、服务、组织和标的。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="593" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">低保真页面原型 · 合成记录</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">两个岗位从相反方向核对同一笔交接</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">服务 FW-01 和合同 HT-01 仅用于走查。评审时请两人各自写下合同、服务、组织和标的。</text>
<rect x="32" y="153" width="468" height="362" rx="10" fill="white" stroke="#bccfc9"/><rect x="33" y="154" width="466" height="49" rx="8" fill="#e4eef7" stroke="#bccfc9"/><text x="49" y="186" font-size="22" font-weight="650" text-anchor="start" fill="#173d39">合同详情</text><text x="50" y="236" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">销售视图 · 已签原件已归档</text><text x="50" y="279" font-size="17" font-weight="400" text-anchor="start" fill="#173d39">签约方　甲方组织　　付款方　甲方组织</text><polyline points="50,290 482,290" fill="none" stroke="#dae4e0" stroke-width="2" stroke-linejoin="round"  /><text x="50" y="321" font-size="17" font-weight="400" text-anchor="start" fill="#173d39">服务范围　被服务组织乙 / 标的甲</text><polyline points="50,332 482,332" fill="none" stroke="#dae4e0" stroke-width="2" stroke-linejoin="round"  /><text x="50" y="363" font-size="17" font-weight="400" text-anchor="start" fill="#173d39">关联服务　FW-01　　负责人　运营甲</text><polyline points="50,374 482,374" fill="none" stroke="#dae4e0" stroke-width="2" stroke-linejoin="round"  /><text x="50" y="405" font-size="17" font-weight="400" text-anchor="start" fill="#173d39">待核事项　两份材料的采样频次有差异</text><polyline points="50,416 482,416" fill="none" stroke="#dae4e0" stroke-width="2" stroke-linejoin="round"  /><rect x="50" y="451" width="179" height="42" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="64" y="479" font-size="17" font-weight="650" text-anchor="start" fill="#173d39">查看关联服务  →</text><rect x="539" y="153" width="468" height="362" rx="10" fill="white" stroke="#bccfc9"/><rect x="540" y="154" width="466" height="49" rx="8" fill="#e4eef7" stroke="#bccfc9"/><text x="556" y="186" font-size="22" font-weight="650" text-anchor="start" fill="#173d39">我的服务 / 服务详情</text><text x="557" y="236" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">运营视图 · 当前授权有效</text><text x="557" y="279" font-size="17" font-weight="400" text-anchor="start" fill="#173d39">服务编号　FW-01　　负责人　运营甲</text><polyline points="557,290 989,290" fill="none" stroke="#dae4e0" stroke-width="2" stroke-linejoin="round"  /><text x="557" y="321" font-size="17" font-weight="400" text-anchor="start" fill="#173d39">被服务组织　组织乙　　标的　标的甲</text><polyline points="557,332 989,332" fill="none" stroke="#dae4e0" stroke-width="2" stroke-linejoin="round"  /><text x="557" y="363" font-size="17" font-weight="400" text-anchor="start" fill="#173d39">合同依据　HT-01　　查看获准材料</text><polyline points="557,374 989,374" fill="none" stroke="#dae4e0" stroke-width="2" stroke-linejoin="round"  /><text x="557" y="405" font-size="17" font-weight="400" text-anchor="start" fill="#173d39">频次依据　材料甲、材料乙　　待核</text><polyline points="557,416 989,416" fill="none" stroke="#dae4e0" stroke-width="2" stroke-linejoin="round"  /><rect x="557" y="451" width="179" height="42" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="571" y="479" font-size="17" font-weight="650" text-anchor="start" fill="#173d39">打开合同依据  →</text><text x="33" y="563" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">空状态：合同尚无关联服务，或员工尚无分配。撤权后再次打开受限资料，显示通用的无法读取提示。</text>
</g></svg>
