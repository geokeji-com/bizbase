<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="492" viewBox="0 0 1040 492" role="img" aria-labelledby="title desc">
<title id="title">首版 A 与备选 B 各验证什么</title><desc id="desc">两种范围都要验证运营独立接手和撤权。B 从已准备好的合同与服务开始。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="490" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">用户故事地图</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">首版 A 与备选 B 各验证什么</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">两种范围都要验证运营独立接手和撤权。B 从已准备好的合同与服务开始。</text>
<text x="273" y="157" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">了解范围</text><rect x="185" y="172" width="188" height="76" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="199" y="200" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">销售核对主体</text><text x="199" y="226" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">合同与适用期间</text><text x="477" y="157" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">确定归属</text><rect x="389" y="172" width="188" height="76" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="403" y="200" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">销售登记服务</text><text x="403" y="226" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">组织、标的、负责人</text><text x="681" y="157" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">取得权限</text><rect x="593" y="172" width="188" height="76" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="607" y="200" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">有权岗位授权</text><text x="607" y="226" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">范围与生效时刻</text><text x="885" y="157" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">接手核对</text><rect x="797" y="172" width="188" height="76" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="811" y="200" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">运营读取依据</text><text x="811" y="226" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">合同、材料及待核项</text><text x="28" y="217" font-size="18" font-weight="650" text-anchor="start" fill="#173d39">岗位活动</text><text x="28" y="307" font-size="18" font-weight="650" text-anchor="start" fill="#173d39">A 完整交接</text><rect x="185" y="276" width="188" height="48" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="279" y="307" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">复用或手工建档</text><rect x="389" y="276" width="188" height="48" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="483" y="307" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">发起一笔新交接</text><rect x="593" y="276" width="188" height="48" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="687" y="307" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">按职责确认授权</text><rect x="797" y="276" width="188" height="48" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="891" y="307" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">两人独立查同一项</text><text x="28" y="377" font-size="18" font-weight="650" text-anchor="start" fill="#173d39">B 查询备选</text><rect x="185" y="346" width="188" height="48" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="279" y="377" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">使用已建合同</text><rect x="389" y="346" width="188" height="48" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="483" y="377" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">使用已关联服务</text><rect x="593" y="346" width="188" height="48" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="687" y="377" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">使用已生效授权</text><rect x="797" y="346" width="188" height="48" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="891" y="377" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">同样验双向与撤权</text><text x="28" y="447" font-size="18" font-weight="650" text-anchor="start" fill="#173d39">后续增量</text><rect x="185" y="416" width="188" height="48" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="279" y="447" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">合同修订与续签</text><rect x="389" y="416" width="188" height="48" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="483" y="447" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">多标的与跨期</text><rect x="593" y="416" width="188" height="48" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="687" y="447" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">对客历史材料授权</text><rect x="797" y="416" width="188" height="48" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="891" y="447" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">配置监测并取证</text>
</g></svg>
