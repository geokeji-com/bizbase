<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="575" viewBox="0 0 1040 575" role="img" aria-labelledby="title desc">
<title id="title">四个岗位各自负责哪一个动作</title><desc id="desc">连线代表岗位参与的用例。销售兼有授权职责时，同一人可以承担两种角色。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="573" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">角色用例图</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">四个岗位各自负责哪一个动作</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">连线代表岗位参与的用例。销售兼有授权职责时，同一人可以承担两种角色。</text>
<rect x="325" y="140" width="390" height="360" rx="10" fill="white" stroke="#bccfc9"/><text x="520" y="172" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">签约交接的用例边界</text><ellipse cx="520" cy="211" rx="145" ry="26" fill="#dcefe8" stroke="#8bada3"/><text x="520" y="217" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">建档并发起交接</text><ellipse cx="520" cy="267" rx="145" ry="26" fill="#dcefe8" stroke="#8bada3"/><text x="520" y="273" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">从合同找服务</text><ellipse cx="520" cy="323" rx="145" ry="26" fill="#dcefe8" stroke="#8bada3"/><text x="520" y="329" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">从服务找合同与材料</text><ellipse cx="520" cy="379" rx="145" ry="26" fill="#dcefe8" stroke="#8bada3"/><text x="520" y="385" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">授予或撤回服务范围</text><ellipse cx="520" cy="435" rx="145" ry="26" fill="#dcefe8" stroke="#8bada3"/><text x="520" y="441" font-size="17" font-weight="400" text-anchor="middle" fill="#173d39">复核变更记录</text><rect x="55" y="198" width="180" height="44" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="145" y="227" font-size="18" font-weight="650" text-anchor="middle" fill="#173d39">销售经办人</text><rect x="798" y="294" width="180" height="44" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="888" y="323" font-size="18" font-weight="650" text-anchor="middle" fill="#173d39">运营负责人</text><rect x="55" y="367" width="180" height="44" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="145" y="396" font-size="18" font-weight="650" text-anchor="middle" fill="#173d39">授权维护人</text><rect x="798" y="418" width="180" height="44" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="888" y="447" font-size="18" font-weight="650" text-anchor="middle" fill="#173d39">有权复核者</text><polyline points="235,218 375,211" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  /><polyline points="235,232 375,267" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  /><polyline points="798,316 665,323" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  /><polyline points="235,389 375,379" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  /><polyline points="798,440 665,435" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  /><text x="30" y="540" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">个人 CLI 或员工 Agent 代表使用者执行同一用例，适用相同的动作与数据范围。</text>
</g></svg>
