<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="728" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc">
<title id="title">发起交接后，运营何时能读到合同</title><desc id="desc">自上向下读。实线为发起操作，虚线为返回结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="726" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">交互时序图</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">发起交接后，运营何时能读到合同</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">自上向下读。实线为发起操作，虚线为返回结果。</text>
<rect x="26" y="144" width="194" height="47" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="123" y="175" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">销售</text><polyline points="123,192 123,664" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  stroke-dasharray="6 5"/><rect x="293" y="144" width="194" height="47" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="390" y="175" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">业务入口</text><polyline points="390,192 390,664" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  stroke-dasharray="6 5"/><rect x="551" y="144" width="194" height="47" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="648" y="175" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">授权维护人</text><polyline points="648,192 648,664" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  stroke-dasharray="6 5"/><rect x="819" y="144" width="194" height="47" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="916" y="175" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">运营</text><polyline points="916,192 916,664" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  stroke-dasharray="6 5"/><polyline points="123,236 390,236" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="256.5" y="226" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">发起交接，附合同和标的</text><polyline points="390,286 123,286" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="256.5" y="276" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">返回草稿和服务标识</text><polyline points="916,336 390,336" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="653.0" y="326" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">我的服务 / 已保存的材料链接</text><polyline points="390,386 916,386" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="653.0" y="376" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">授权尚未生效，无法读取</text><polyline points="648,436 390,436" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="519.0" y="426" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">核对归属，登记有效授权</text><polyline points="123,486 390,486" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="256.5" y="476" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">从合同查关联服务</text><polyline points="390,536 123,536" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="256.5" y="526" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">返回本销售有权看的服务</text><polyline points="916,586 390,586" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="653.0" y="576" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">从我的服务找合同与材料</text><polyline points="390,636 916,636" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="653.0" y="626" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">返回同一服务标识、合同、标的及两份频次依据</text><text x="30" y="700" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">对应 A1、A2、A6、A9。频次冲突保留各自来源，执行、考核和结算分别核实。</text>
</g></svg>
