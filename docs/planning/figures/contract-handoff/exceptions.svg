<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="628" viewBox="0 0 1040 628" role="img" aria-labelledby="title desc">
<title id="title">重试和撤权后，原来的入口会返回什么</title><desc id="desc">上半段验一次写入的结果；下半段验新请求是否按当前范围重新判定。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="626" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">交互时序图</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">重试和撤权后，原来的入口会返回什么</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">上半段验一次写入的结果；下半段验新请求是否按当前范围重新判定。</text>
<rect x="26" y="144" width="194" height="47" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="123" y="175" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">销售</text><polyline points="123,192 123,564" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  stroke-dasharray="6 5"/><rect x="293" y="144" width="194" height="47" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="390" y="175" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">业务入口</text><polyline points="390,192 390,564" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  stroke-dasharray="6 5"/><rect x="551" y="144" width="194" height="47" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="648" y="175" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">授权维护人</text><polyline points="648,192 648,564" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  stroke-dasharray="6 5"/><rect x="819" y="144" width="194" height="47" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="916" y="175" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">运营</text><polyline points="916,192 916,564" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round"  stroke-dasharray="6 5"/><polyline points="123,236 390,236" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="256.5" y="226" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">提交交接，响应未送达</text><polyline points="123,286 390,286" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="256.5" y="276" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">重试同一次交接</text><polyline points="390,336 123,336" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="256.5" y="326" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">返回原服务标识，仅一次交接生效</text><polyline points="648,386 390,386" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="519.0" y="376" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">撤回运营对本项服务的授权</text><polyline points="390,436 648,436" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="519.0" y="426" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">记录撤权范围与生效时间</text><polyline points="916,486 390,486" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="653.0" y="476" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">打开旧材料链接或使用个人 CLI 重查</text><polyline points="390,536 916,536" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="653.0" y="526" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">已撤回范围拒绝读取；独立有效授权继续适用</text><text x="30" y="600" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">对应 A4、A5、A7、A8。交接写入失败时检查没有遗留生效授权，再执行重试。</text>
</g></svg>
