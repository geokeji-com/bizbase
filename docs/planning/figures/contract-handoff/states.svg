<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="461" viewBox="0 0 1040 461" role="img" aria-labelledby="title desc">
<title id="title">什么变化会影响交接与访问</title><desc id="desc">授权生效后可以接手；成员被撤权时合同和服务仍可由其他有权成员追溯。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="459" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">状态转换图</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">什么变化会影响交接与访问</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">授权生效后可以接手；成员被撤权时合同和服务仍可由其他有权成员追溯。</text>
<rect x="32" y="150" width="262" height="84" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="46" y="178" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">已有签署依据</text><text x="46" y="204" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">C1 使用已签原件</text><rect x="390" y="150" width="261" height="84" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="404" y="178" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">交接草稿</text><text x="404" y="204" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">合同、标的、负责人</text><rect x="740" y="150" width="267" height="84" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="754" y="178" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">可独立接手</text><text x="754" y="204" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">两岗可回查同一服务</text><polyline points="294,193 388,193" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="651,193 739,193" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="340" y="179" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">发起</text><text x="695" y="179" font-size="16" font-weight="400" text-anchor="middle" fill="#173d39">授权生效</text><rect x="390" y="300" width="261" height="83" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="404" y="328" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">修正草稿</text><text x="404" y="354" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">范围冲突或负责人不合规</text><polyline points="461,235 461,299" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="581,299 581,235" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="418" y="272" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">退回</text><text x="623" y="272" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">重提</text><rect x="740" y="300" width="267" height="83" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="754" y="328" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">该成员授权已撤回</text><text x="754" y="354" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">记录仍归原服务</text><polyline points="872,235 872,299" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="919" y="272" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">撤权</text><text x="32" y="427" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">交接进度、成员读取权和合同条款确认是三件事。图示为岗位可观察的状态，具体字段待设计。</text>
</g></svg>
