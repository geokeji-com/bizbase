<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="548" viewBox="0 0 1040 548" role="img" aria-labelledby="title desc">
<title id="title">从一份合同到一份能复算的双周报</title><desc id="desc">沿上排读首次出数的依赖；回链可提前导入，实际引用要等回答回来。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="546" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">交付路线</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">从一份合同到一份能复算的双周报</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">沿上排读首次出数的依赖；回链可提前导入，实际引用要等回答回来。</text>
<polyline points="220,184 279,184" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="468,184 527,184" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="716,184 775,184" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="126,224 126,283" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="622,224 622,257 420,257 420,283" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="868,224 868,248 917,248 917,283" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="220,322 279,322" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="188,359 188,382 720,382 720,344 772,344" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><polyline points="868,359 868,410" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" /><polyline points="46,224 21,224 21,452 279,452" fill="none" stroke="#627d78" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="30" y="148" width="190" height="75" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="44" y="176" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">1  签约交接</text><text x="44" y="202" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">确定服务、标的和成员</text><rect x="278" y="148" width="190" height="75" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="292" y="176" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">2  监测配置</text><text x="292" y="202" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">问句、条件与执行依据</text><rect x="526" y="148" width="190" height="75" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="540" y="176" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">3  原始回答</text><text x="540" y="202" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">取得真实端采集证据</text><rect x="774" y="148" width="190" height="75" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="788" y="176" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">4  首次可信出数</text><text x="788" y="202" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">按样本复核一个数字</text><rect x="30" y="284" width="190" height="75" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="44" y="312" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">5  导入回链</text><text x="44" y="338" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">记录稿件与发布位置</text><rect x="278" y="284" width="192" height="75" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="292" y="312" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">5  匹配实际引用</text><text x="292" y="338" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">比对回答中的信源</text><text x="576" y="374" font-size="15" font-weight="400" text-anchor="middle" fill="#173d39">按合同要求补投放材料</text><rect x="774" y="284" width="230" height="75" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="788" y="312" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">6  双周交付</text><text x="788" y="338" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">复算报告与当期证据</text><rect x="774" y="410" width="230" height="75" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="788" y="438" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">7  对客开放</text><text x="788" y="464" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">核准历史材料与期间</text><rect x="278" y="410" width="268" height="75" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="292" y="438" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">8  扩展业务线</text><text x="292" y="464" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">依各接入方的事实和授权</text><text x="30" y="520" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">实线表示前置依赖；虚线表示还需具体合同、接入方或授权依据。</text>
</g></svg>
