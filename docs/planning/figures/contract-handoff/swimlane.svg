<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="608" viewBox="0 0 1040 608" role="img" aria-labelledby="title desc">
<title id="title">谁把哪份依据交给谁</title><desc id="desc">横向读各岗位的工作，纵向看同一阶段需要哪些人和系统事实。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#627d78"/></marker></defs>
<g font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect x="1" y="1" width="1038" height="606" rx="14" fill="#fbfcfa" stroke="#c2d1cc"/>
<text x="30" y="38" font-size="16" font-weight="650" text-anchor="start" fill="#386b5d">岗位泳道 · 服务蓝图</text>
<text x="30" y="79" font-size="30" font-weight="650" text-anchor="start" fill="#173d39">谁把哪份依据交给谁</text>
<text x="30" y="112" font-size="17" font-weight="400" text-anchor="start" fill="#3f5b58">横向读各岗位的工作，纵向看同一阶段需要哪些人和系统事实。</text>
<text x="270" y="161" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">已签合同</text><text x="477" y="161" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">发起交接</text><text x="684" y="161" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">授权生效</text><text x="891" y="161" font-size="19" font-weight="650" text-anchor="middle" fill="#173d39">独立核对</text><text x="31" y="225" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">销售</text><rect x="178" y="183" width="192" height="72" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="192" y="211" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">定位合同</text><text x="192" y="237" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">核对三方主体</text><rect x="385" y="183" width="192" height="72" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="399" y="211" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">建交接草稿</text><text x="399" y="237" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">选标的和负责人</text><rect x="592" y="183" width="192" height="72" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="606" y="211" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">查看交接进度</text><text x="606" y="237" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">按职责确认范围</text><rect x="799" y="183" width="192" height="72" rx="10" fill="#e4eef7" stroke="#bccfc9"/><text x="813" y="211" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">从合同找服务</text><text x="813" y="237" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">写下服务与标的</text><text x="31" y="317" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">授权维护人</text><rect x="178" y="275" width="192" height="72" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="192" y="303" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">核对依据</text><text x="192" y="329" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">确认合同期间</text><rect x="385" y="275" width="192" height="72" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="399" y="303" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">核对成员</text><text x="399" y="329" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">检查资料归属</text><rect x="592" y="275" width="192" height="72" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="606" y="303" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">授予约定范围</text><text x="606" y="329" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">记录生效时间</text><rect x="799" y="275" width="192" height="72" rx="10" fill="#fcf0d6" stroke="#bccfc9"/><text x="813" y="303" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">必要时撤回</text><text x="813" y="329" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">保留审计记录</text><text x="31" y="409" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">运营</text><rect x="178" y="367" width="192" height="72" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="192" y="395" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">尚未接手</text><text x="192" y="421" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58"></text><rect x="385" y="367" width="192" height="72" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="399" y="395" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">尚未获权</text><text x="399" y="421" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">列表无该服务</text><rect x="592" y="367" width="192" height="72" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="606" y="395" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">打开我的服务</text><text x="606" y="421" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">读取获准材料</text><rect x="799" y="367" width="192" height="72" rx="10" fill="#dcefe8" stroke="#bccfc9"/><text x="813" y="395" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">从服务找合同</text><text x="813" y="421" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">指出频次待核项</text><text x="31" y="501" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">后台凭据</text><rect x="178" y="459" width="192" height="72" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="192" y="487" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">合同编号</text><text x="192" y="513" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">签署版本</text><rect x="385" y="459" width="192" height="72" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="399" y="487" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">服务标识</text><text x="399" y="513" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">合同与标的关联</text><rect x="592" y="459" width="192" height="72" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="606" y="487" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">成员有效期</text><text x="606" y="513" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">资料授权与经办人</text><rect x="799" y="459" width="192" height="72" rx="10" fill="#eff3f2" stroke="#bccfc9"/><text x="813" y="487" font-size="19" font-weight="650" text-anchor="start" fill="#173d39">两岗核对结果</text><text x="813" y="513" font-size="15" font-weight="400" text-anchor="start" fill="#3f5b58">权限正反例</text><text x="30" y="578" font-size="16" font-weight="400" text-anchor="start" fill="#3f5b58">若同一人兼任销售和授权维护人，仍分别核对其发起与授权职责。表中每列表示同一阶段。</text>
</g></svg>
