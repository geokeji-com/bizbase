name: BizBase directory public checks
on:
  push:
    paths: ['apps/bizbase/**', 'scripts/directory/**', 'tests/directory/**', 'prototypes/directory/**', '.github/workflows/directory.yml']
  pull_request:
    paths: ['apps/bizbase/**', 'scripts/directory/**', 'tests/directory/**', 'prototypes/directory/**', '.github/workflows/directory.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
      - name: Public synthetic suite (no private snapshot or site)
        run: python scripts/directory/verify_round01.py --public
      - name: Browser tooling audit
        working-directory: tests/directory/browser
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npm audit --registry=https://registry.npmjs.org --audit-level=moderate
      - name: New Python build dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -c 'from pathlib import Path; Path("/tmp/bizbase-new-requirements.txt").write_text("flit_core==3.12.0\n")'
          python -m pip_audit --no-deps --disable-pip -r /tmp/bizbase-new-requirements.txt
