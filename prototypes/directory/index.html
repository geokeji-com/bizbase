<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>客户目录 · BizBase 交互原型</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <aside class="prototype-bar" aria-label="原型场景工具栏" data-testid="prototype-toolbar">
      <div class="prototype-label"><span class="prototype-dot" aria-hidden="true"></span><strong>交互原型 · 合成数据</strong><span class="prototype-description">所有客户与对象均为合成夹具</span></div>
      <div class="prototype-controls">
        <label for="scenario-select">场景</label>
        <select id="scenario-select" data-testid="scenario-select">
          <option value="normal">正常查询</option>
          <option value="no-results">查询无结果</option>
          <option value="zero-subjects">客户没有对象</option>
          <option value="loading">延迟加载（2 秒）</option>
          <option value="source-error">来源失败</option>
          <option value="forbidden">无权限</option>
          <option value="disabled">功能关闭</option>
        </select>
        <button class="button button-small" id="directory-toggle" data-testid="directory-toggle" type="button">模拟停用目录</button>
        <button class="button button-small button-quiet" id="reset-prototype" data-testid="reset-prototype" type="button">重置</button>
      </div>
    </aside>

    <header class="desk-header">
      <div class="desk-header-inner">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span class="brand-name">BizBase</span>
        <span class="breadcrumb-divider" aria-hidden="true">/</span>
        <span class="breadcrumb-current">客户目录</span>
      </div>
    </header>

    <main class="page">
      <div class="page-heading">
        <div><p class="eyebrow">目录</p><h1>客户目录</h1></div>
        <button class="button" id="refresh-directory" data-testid="refresh-directory" type="button">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .4 5M16 3v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          刷新
        </button>
      </div>

      <div id="notice" class="notice" role="status" data-testid="action-notice" hidden></div>
      <section id="snapshot-meta" class="snapshot-meta" aria-label="数据来源" data-testid="snapshot-meta" hidden>
        <span class="snapshot-badge" data-testid="snapshot-mode">历史快照</span>
        <span class="meta-pair">数据日期 <strong data-testid="data-as-of">2026-11-02</strong></span>
        <span class="meta-pair">目录版本 <span class="mono" data-testid="directory-version">synthetic-v1</span></span>
        <span class="meta-pair">来源 <span class="mono" data-testid="source-system">synthetic-directory</span></span>
      </section>

      <div id="directory-content" data-testid="directory-content"></div>
      <p class="page-footnote">仅展示当前获准读取的客户与优化对象。</p>
      <div id="live-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>
  </body>
</html>
