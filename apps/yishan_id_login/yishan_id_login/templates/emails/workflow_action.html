<p>
	{% for action in actions %}
	<a class="btn{% if action.is_primary %} btn-primary{% endif %}" style="margin-right: 8px" href="{{ action.action_link }}">{{ {'Approve': '批准', 'Reject': '驳回'}.get(action.action_name, action.action_name) | e }}</a>
	{% endfor %}
</p>
