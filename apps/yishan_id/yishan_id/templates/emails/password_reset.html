<h1 class="email-title">重置 BizBase 密码</h1>
<p>{{ first_name | e }}，您好！我们收到了您账号的密码重置申请。</p>
{% if expiry_minutes %}<p>此链接在 {{ expiry_minutes | e }} 分钟内有效。</p>{% endif %}
<p class="email-action"><a class="email-btn email-btn-primary" href="{{ link | e }}">重置我的密码</a></p>
<p>如果按钮无法打开，请将下面的链接复制到浏览器中打开。</p>
<p><a href="{{ link | e }}">{{ link | e }}</a></p>
<p>如果您没有申请重置密码，请忽略这封邮件。您的密码不会因此改变。</p>
